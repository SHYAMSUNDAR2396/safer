[project]
name = "safer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "authlib>=1.6,<2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "httpx2>=2.16.0",
  "boto3>=1.40,<2",
  "pypdf>=6,<7",
  "pillow>=11,<13",
  "celery[redis]>=5.5,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
