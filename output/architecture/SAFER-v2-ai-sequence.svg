<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1600" viewBox="0 0 2040 1600"><rect width="100%" height="100%" fill="white"/><text font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="600" fill="#123047" text-anchor="start"><tspan x="44" y="65.9">SAFER | Advisory AI request sequence</tspan></text><text font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#526779" text-anchor="start"><tspan x="46" y="103.95">Explicit reviewer action • source-bound answers • deterministic financial authority • no model tools</tspan></text><polyline points="44,125 1996,125" fill="none" stroke="#bdcbd5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><rect x="35" y="170" width="310" height="95" rx="12" fill="#edf5ff" stroke="#2363ad" stroke-width="2"  opacity="1"/><image x="53" y="189" width="46" height="46" href="data:image/svg+xml;base64,"/><text font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#2363ad" text-anchor="start"><tspan x="115" y="211.75">Reviewer</tspan></text><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start"><tspan x="115" y="239.1">Browser / explicit action</tspan></text><polyline points="190,275 190,1190" fill="none" stroke="#bdcbd5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><rect x="445" y="170" width="310" height="95" rx="12" fill="#edf5ff" stroke="#2363ad" stroke-width="2"  opacity="1"/><image x="463" y="189" width="46" height="46" href="data:image/svg+xml;base64,"/><text font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#2363ad" text-anchor="start"><tspan x="525" y="211.75">FastAPI</tspan></text><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start"><tspan x="525" y="239.1">Authorize + build sources</tspan></text><polyline points="600,275 600,1190" fill="none" stroke="#bdcbd5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><rect x="855" y="170" width="310" height="95" rx="12" fill="#edf5ff" stroke="#2363ad" stroke-width="2"  opacity="1"/><image x="873" y="189" width="46" height="46" href="data:image/svg+xml;base64,"/><text font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#2363ad" text-anchor="start"><tspan x="935" y="211.75">PostgreSQL</tspan></text><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start"><tspan x="935" y="239.1">Grants / facts / usage</tspan></text><polyline points="1010,275 1010,1190" fill="none" stroke="#bdcbd5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><rect x="1265" y="170" width="310" height="95" rx="12" fill="#edf5ff" stroke="#2363ad" stroke-width="2"  opacity="1"/><image x="1283" y="189" width="46" height="46" href="data:image/svg+xml;base64,"/><text font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#2363ad" text-anchor="start"><tspan x="1345" y="211.75">Provider adapter</tspan></text><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start"><tspan x="1345" y="239.1">Bound transport + validate</tspan></text><polyline points="1420,275 1420,1190" fill="none" stroke="#bdcbd5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><rect x="1685" y="170" width="310" height="95" rx="12" fill="#f4edfc" stroke="#7544a6" stroke-width="2"  opacity="1"/><image x="1703" y="189" width="46" height="46" href="data:image/svg+xml;base64,"/><text font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#7544a6" text-anchor="start"><tspan x="1765" y="211.75">Gemini API</tspan></text><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#526779" text-anchor="start"><tspan x="1765" y="239.1">Untrusted external wording</tspan></text><polyline points="1840,275 1840,1190" fill="none" stroke="#bdcbd5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><polyline points="190,324 600,324" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="590.1927488298513,328.9817491391698 600,324 590.1927488298513,319.0182508608302" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="204" y="292" width="334.8" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="210" y="311.1">1  GET authorized source package</tspan></text><polyline points="600,390 1010,390" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1000.1927488298513,394.9817491391698 1010,390 1000.1927488298513,385.0182508608302" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="614" y="358" width="364.5" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="620" y="377.1">2  Read current grants + case facts</tspan></text><polyline points="600,456 190,456" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="199.80725117014862,451.0182508608302 190,456 199.80725117014862,460.9817491391697" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="204" y="424" width="380" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="210" y="443.1">3  Return sources + digest; no model call</tspan></text><polyline points="190,522 600,522" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="590.1927488298513,526.9817491391698 600,522 590.1927488298513,517.0182508608302" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="204" y="490" width="324.90000000000003" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="210" y="509.1">4  POST purpose + digest + CSRF</tspan></text><rect x="445" y="554" width="310" height="88" rx="12" fill="#eaf7f3" stroke="#0d786c" stroke-width="2"  opacity="1"/><text font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#0d786c" text-anchor="start"><tspan x="461" y="580.15">Check MFA / scope / feature switch</tspan><tspan x="461" y="601.4">Synthetic consent + exact approval</tspan><tspan x="461" y="622.65">Private credential configuration</tspan></text><polyline points="600,700 1010,700" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1000.1927488298513,704.9817491391698 1010,700 1000.1927488298513,695.0182508608302" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="614" y="668" width="380" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="620" y="687.1">5  One slot + durable cost reservation</tspan></text><polyline points="600,775 1420,775" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1410.1927488298513,779.9817491391698 1420,775 1410.1927488298513,770.0182508608302" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="614" y="743" width="364.5" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="620" y="762.1">6  Minimized, bounded source blocks</tspan></text><polyline points="1420,850 1840,850" fill="none" stroke="#7544a6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1830.1927488298513,854.9817491391698 1840,850 1830.1927488298513,845.0182508608302" fill="none" stroke="#7544a6" stroke-width="2.2" stroke-linecap="round"/><rect x="1434" y="818" width="334.8" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#7544a6" text-anchor="start"><tspan x="1440" y="837.1">7  Fixed HTTPS request; no tools</tspan></text><polyline points="1840,925 1420,925" fill="none" stroke="#7544a6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1429.8072511701487,920.0182508608302 1420,925 1429.8072511701487,929.9817491391698" fill="none" stroke="#7544a6" stroke-width="2.2" stroke-linecap="round"/><rect x="1434" y="893" width="275.40000000000003" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#7544a6" text-anchor="start"><tspan x="1440" y="912.1">8  Untrusted JSON response</tspan></text><polyline points="1420,1000 600,1000" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="609.8072511701487,995.0182508608302 600,1000 609.8072511701487,1004.9817491391698" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="614" y="968" width="463.50000000000006" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="620" y="987.1">9  Validate complete schema + exact block IDs</tspan></text><polyline points="600,1075 1010,1075" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="1000.1927488298513,1079.9817491391698 1010,1075 1000.1927488298513,1070.0182508608302" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="614" y="1043" width="380" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="620" y="1062.1">10  Recheck session, grants + sources</tspan></text><polyline points="600,1150 190,1150" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="199.80725117014862,1145.0182508608302 190,1150 199.80725117014862,1154.9817491391698" fill="none" stroke="#2363ad" stroke-width="2.2" stroke-linecap="round"/><rect x="204" y="1118" width="380" height="28.5" rx="12" fill="#ffffff" stroke="transparent" stroke-width="0"  opacity="0.96"/><text font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#2363ad" text-anchor="start"><tspan x="210" y="1137.1">11  Advisory text + server facts/citations</tspan></text><rect x="48" y="1230" width="1944" height="100" rx="12" fill="#fff6df" stroke="#a3650a" stroke-width="2"  opacity="1"/><text font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#a3650a" text-anchor="start"><tspan x="72" y="1266.85">ALT A · Switched off / unapproved / busy / budget exhausted / provider failure</tspan></text><text font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#123047" text-anchor="start"><tspan x="72" y="1302.95">Use deterministic local fallback. A failing admission gate never dispatches a model request.</tspan></text><rect x="48" y="1360" width="1944" height="100" rx="12" fill="#f4edfc" stroke="#7544a6" stroke-width="2"  opacity="1"/><text font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#7544a6" text-anchor="start"><tspan x="72" y="1396.85">ALT B · Session or grant revoked / source digest changed during generation</tspan></text><text font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#123047" text-anchor="start"><tspan x="72" y="1432.95">Discard generated wording and return an access/stale-source error. The model never updates verification or release state.</tspan></text><polyline points="44,1530 1996,1530" fill="none" stroke="#bdcbd5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" /><text font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#526779" text-anchor="start"><tspan x="46" y="1563.15">Default OFF • no automatic retries • conservative reservation retained on uncertain failures • browser checks sources every 15 seconds and on focus • live model evaluation pending</tspan></text></svg>