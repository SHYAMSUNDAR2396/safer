# LOCAL readiness certificate only. The final India-hosted endpoint needs trusted PKI.
server {
  listen 8443 ssl;
  server_name localhost;
  ssl_certificate /run/secrets/tls-cert;
  ssl_certificate_key /run/secrets/tls-key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  location /api/ { proxy_pass http://app:8000; proxy_set_header Host localhost; proxy_read_timeout 30s; }
  location /auth/ { proxy_pass http://app:8000; proxy_set_header Host localhost; proxy_read_timeout 15s; }
  location /health/ { proxy_pass http://app:8000; proxy_set_header Host localhost; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
